appId: com.dualactionwindows.dawdrive
name: Settings and account journey
---
- launchApp
- assertVisible: "LONE RIDER"
- tapOn:
    text: "SETTINGS|NASTAVENÍ"
- assertVisible:
    text: "Settings|Nastavení"
- scrollUntilVisible:
    element:
      text: "Account & cloud|Účet & cloud"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Account & cloud|Účet & cloud"
- takeScreenshot: artifacts/screenshots/05-settings
- tapOn:
    text: "OPEN|OTEVŘÍT"
    index: 0
- assertVisible:
    text: "ACCOUNT & CLOUD|ÚČET & CLOUD"
- assertVisible:
    text: "Guest|Host"
- takeScreenshot: artifacts/screenshots/06-account-cloud
- tapOn:
    text: "‹ BACK|‹ ZPĚT"
- assertVisible:
    text: "Settings|Nastavení"
