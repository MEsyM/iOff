<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lone Rider Admin</title><style>
:root{color-scheme:dark;--bg:#071018;--panel:#0e1b26;--line:#263746;--accent:#43decf;--muted:#8ca0b0}*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:#fff}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px}
header b{font-size:20px}header span{color:var(--accent);font-size:12px;letter-spacing:2px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
nav{border-right:1px solid var(--line);padding:18px 10px}nav button{width:100%;text-align:left;background:none;border:0;color:#c7d3dc;padding:11px 12px;border-radius:9px;cursor:pointer;margin:2px 0}
nav button:hover,nav button.active{background:#142735;color:#fff}main{padding:22px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card strong{display:block;font-size:28px;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{background:#09151f;border:1px solid var(--line);color:white;border-radius:8px;padding:9px}
button.primary{background:var(--accent);color:#00110f;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#162b3a;color:white;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #1d2c37;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}.badge{padding:3px 7px;border-radius:999px;background:#17343a;color:var(--accent);font-size:11px}.off{color:#ef8d8d}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modalbox{background:#0d1b25;border:1px solid var(--line);width:min(850px,96vw);max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;color:#9fb0bd;font-size:12px}textarea{min-height:88px}
#login{position:fixed;inset:0;background:#061018;display:flex;align-items:center;justify-content:center;z-index:20}.loginbox{width:340px}.muted{color:var(--muted)}
@media(max-width:750px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:140px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="panel loginbox">
<h2>Lone Rider Admin</h2><p class="muted" id="loginModeText">Sign in with your administrator account.</p>
<div id="setupFields" style="display:none">
<input id="setupCode" type="password" placeholder="One-time setup code" style="width:100%;margin-bottom:8px">
<input id="displayName" placeholder="Display name" style="width:100%;margin-bottom:8px">
</div>
<input id="emailInput" type="email" placeholder="Login / Email" style="width:100%;margin-bottom:8px">
<input id="passwordInput" type="password" placeholder="Password" style="width:100%">
<button class="primary" id="loginButton" style="width:100%;margin-top:10px" onclick="login()">Sign in</button>
<p class="muted" id="loginError" style="display:none"></p>
</div></div>
<header><b>LONE RIDER</b><span>CONTENT ADMIN</span><div style="margin-left:auto;display:flex;gap:12px;align-items:center"><span id="whoami" class="muted"></span><span id="releaseLabel"></span><button class="secondary" onclick="logout()">Sign out</button></div></header>
<div class="layout"><nav id="nav"></nav><main><div class="cards" id="cards"></div><div class="panel">
<div class="toolbar"><input id="search" placeholder="Search…" oninput="loadItems()"><select id="category" onchange="loadItems()"><option value="">All categories</option></select>
<button class="secondary" onclick="newItem()">+ New</button><button class="primary" onclick="publish()">Publish version</button></div><div id="content"></div></div></main></div>
<div id="modal"><div class="modalbox"><div style="display:flex"><h2 id="modalTitle">Edit</h2><button class="secondary" style="margin-left:auto" onclick="closeModal()">Close</button></div><div id="form" class="grid"></div><div style="display:flex;gap:8px;margin-top:16px"><button class="primary" onclick="save()">Save draft</button><button class="secondary" onclick="archiveCurrent()">Disable / archive</button></div></div></div>
<script>
const kinds=[["trivia","Trivia"],["kids_game","Kids Trivia EN/CZ"],["kids_trivia","Kids Trivia CZ Pack"],["guess_who","Guess WHO"],["spelling_bee","Spelling Bee"],["english_lesson","English Lessons"],["game_config","Game Settings"],["releases","Releases"],["admin_users","Admin Users"]];
let kind="trivia",items=[],current=null,csrf="",me=null,setupRequired=false;
function headers(write=false){let out={"Content-Type":"application/json"};if(write&&csrf)out["X-CSRF-Token"]=csrf;return out}
async function api(url,opt={}){let write=opt.method&&opt.method!=="GET";opt.headers={...(opt.headers||{}),...headers(write)};opt.credentials="same-origin";let r=await fetch(url,opt);if(r.status===401){document.querySelector("#login").style.display="flex";throw Error("Unauthorized")}if(!r.ok){let t=await r.text();throw Error(t)}return r.status===204?null:r.json()}
async function checkAuth(){let st=await fetch("/v1/admin/auth/status",{credentials:"same-origin"}).then(r=>r.json());setupRequired=st.setup_required;setupFields.style.display=setupRequired?"block":"none";loginModeText.textContent=setupRequired?"Create the first administrator account.":"Sign in with your administrator account.";loginButton.textContent=setupRequired?"Create administrator":"Sign in";
try{let m=await api("/v1/admin/auth/me");me=m.user;csrf=m.csrf_token;whoami.textContent=me.display_name+" · "+me.role;document.querySelector("#login").style.display="none";await loadSummary();loadItems()}catch(e){document.querySelector("#login").style.display="flex"}}
async function login(){loginError.style.display="none";try{let body={login:emailInput.value,password:passwordInput.value};let url="/v1/admin/auth/login";if(setupRequired){url="/v1/admin/auth/setup";body={email:emailInput.value,password:passwordInput.value,setup_code:setupCode.value,display_name:displayName.value}}let r=await api(url,{method:"POST",body:JSON.stringify(body)});me=r.user;csrf=r.csrf_token;whoami.textContent=me.display_name+" · "+me.role;document.querySelector("#login").style.display="none";await loadSummary();loadItems()}catch(e){loginError.textContent="Sign-in failed";loginError.style.display="block"}}
async function logout(){try{await api("/v1/admin/auth/logout",{method:"POST"})}catch(e){}csrf="";me=null;document.querySelector("#login").style.display="flex";await checkAuth()}
function makeNav(){nav.innerHTML=kinds.map(x=>'<button data-k="'+x[0]+'" onclick="selectKind(\''+x[0]+'\')">'+x[1]+'</button>').join("");markNav()}function markNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.k===kind))}
function selectKind(k){kind=k;markNav();category.value="";loadItems()}async function loadSummary(){let s=await api("/v1/admin/content/summary");releaseLabel.textContent=s.active_release?"LIVE "+s.active_release:"NOT PUBLISHED";cards.innerHTML=Object.entries(s.counts).map(([k,v])=>'<div class="card"><span class="muted">'+k.replaceAll("_"," ")+'</span><strong>'+v+'</strong></div>').join("")}
async function loadItems(){applyRoleUi();if(kind==="releases")return loadReleases();if(kind==="admin_users")return loadAdminUsers();let d=await api('/v1/admin/content?kind='+encodeURIComponent(kind)+'&q='+encodeURIComponent(search.value||"")+'&category='+encodeURIComponent(category.value||"")+'&page_size=200');items=d.items;renderTable();refreshCats()}
function label(x){let d=x.data||{};return d.localized?.en?.prompt||d.prompt||d.promptEn||d.name||d.word||x.public_id}
function renderTable(){let canEdit=me&&["editor","admin"].includes(me.role);content.innerHTML='<table><thead><tr><th>ID</th><th>Content</th><th>Category</th><th>Difficulty</th><th>Status</th><th></th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.public_id)+'</td><td>'+esc(label(x))+'</td><td>'+esc(x.category||"")+'</td><td>'+(x.difficulty??"")+'</td><td><span class="badge">'+x.status+'</span> '+(x.enabled?"":"<span class=off>OFF</span>")+'</td><td>'+(canEdit?'<button class=secondary onclick="edit(\''+x.id+'\')">Edit</button>':'')+'</td></tr>').join("")+'</tbody></table>'}
function refreshCats(){let cs=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();let cur=category.value;category.innerHTML='<option value="">All categories</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join("");category.value=cur}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function field(n,l,v="",t="text",full=false){return '<label class="'+(full?"full":"")+'">'+l+(t==="textarea"?'<textarea id="f_'+n+'">'+esc(v)+'</textarea>':'<input id="f_'+n+'" type="'+t+'" value="'+esc(v)+'">')+'</label>'}function lines(v){return Array.isArray(v)?v.join("\n"):v||""}
function edit(id){current=items.find(x=>x.id===id);openForm(current)}function newItem(){current={id:null,public_id:"",kind,category:"",difficulty:1,enabled:true,status:"draft",data:{}};openForm(current)}
function openForm(x){modal.style.display="flex";modalTitle.textContent=(x.id?"Edit ":"New ")+kind.replaceAll("_"," ");let d=x.data||{};let h=field("public_id","ID",x.public_id)+field("category","Category",x.category||"")+field("difficulty","Difficulty",x.difficulty??"","number");
if(kind==="trivia"||kind==="kids_game"){h+=field("prompt_en","Question EN",d.localized?.en?.prompt||"","textarea",true)+field("answers_en","Answers EN — one per line",lines(d.localized?.en?.answers),"textarea")+field("explanation_en","Explanation EN",d.localized?.en?.explanation||"","textarea")+field("prompt_cs","Question CS",d.localized?.cs?.prompt||"","textarea",true)+field("answers_cs","Answers CS — one per line",lines(d.localized?.cs?.answers),"textarea")+field("explanation_cs","Explanation CS",d.localized?.cs?.explanation||"","textarea")}
else if(kind==="kids_trivia"){h+=field("minAge","Min age",d.minAge??6,"number")+field("maxAge","Max age",d.maxAge??12,"number")+field("prompt","Question",d.prompt||"","textarea",true)+field("answers","Answers — one per line",lines(d.answers),"textarea",true)+field("explanation","Explanation",d.explanation||"","textarea",true)}
else if(kind==="guess_who"){h+=field("name","Name",d.name||"")+field("region","Region",d.region||"")+field("aliases","Aliases — one per line",lines(d.aliases),"textarea",true)+field("clues_en","Clues EN — one per line",lines(d.clues?.en),"textarea")+field("clues_cs","Clues CS — one per line",lines(d.clues?.cs),"textarea")}
else if(kind==="spelling_bee"){h+=field("word","Word",d.word||"")+field("hint_en","Hint EN",d.hints?.en||"","textarea")+field("hint_cs","Hint CS",d.hints?.cs||"","textarea")}
else if(kind==="english_lesson"){h+=field("audience","Audience",d.audience||"adult")+field("levelRank","Level rank",d.levelRank??1,"number")+field("type","Lesson type",d.type||"phrase")+field("topic","Topic",d.topic||"")+field("promptCs","Prompt CS",d.promptCs||"","textarea",true)+field("promptEn","Prompt EN",d.promptEn||"","textarea",true)+field("answers","Accepted answers — one per line",lines(d.answers),"textarea",true)+field("teaching","Teaching note",d.teaching||"","textarea",true)}
else if(kind==="game_config"){h+=field("json","Configuration JSON",JSON.stringify(d,null,2),"textarea",true)}form.innerHTML=h}
function val(n){return document.querySelector("#f_"+n)?.value??""}function arr(n){return val(n).split("\n").map(x=>x.trim()).filter(Boolean)}
async function save(){let data={};let difficulty=val("difficulty")===""?null:Number(val("difficulty"));let cat=val("category")||null;
if(kind==="trivia"||kind==="kids_game")data={id:val("public_id"),difficulty,category:cat,localized:{en:{prompt:val("prompt_en"),answers:arr("answers_en"),explanation:val("explanation_en")},cs:{prompt:val("prompt_cs"),answers:arr("answers_cs"),explanation:val("explanation_cs")}},enabled:true};
else if(kind==="kids_trivia")data={id:val("public_id"),category:cat,minAge:Number(val("minAge")),maxAge:Number(val("maxAge")),prompt:val("prompt"),answers:arr("answers"),explanation:val("explanation")};
else if(kind==="guess_who")data={id:val("public_id"),name:val("name"),aliases:arr("aliases"),region:val("region"),difficulty,clues:{en:arr("clues_en"),cs:arr("clues_cs")},enabled:true};
else if(kind==="spelling_bee")data={id:val("public_id"),difficulty,word:val("word"),hints:{en:val("hint_en"),cs:val("hint_cs")},enabled:true};
else if(kind==="english_lesson")data={id:val("public_id"),audience:val("audience"),levelRank:Number(val("levelRank")),type:val("type"),topic:val("topic"),promptCs:val("promptCs"),promptEn:val("promptEn"),answers:arr("answers"),teaching:val("teaching")};
else if(kind==="game_config"){try{data=JSON.parse(val("json"))}catch(e){alert("Invalid JSON");return}}
let body={public_id:val("public_id"),kind,category:cat,difficulty,enabled:true,data};if(current.id)await api("/v1/admin/content/"+current.id,{method:"PATCH",body:JSON.stringify(body)});else await api("/v1/admin/content",{method:"POST",body:JSON.stringify(body)});closeModal();await loadSummary();loadItems()}
async function archiveCurrent(){if(!current?.id)return;if(confirm("Disable/archive this item?")){await api("/v1/admin/content/"+current.id,{method:"DELETE"});closeModal();loadSummary();loadItems()}}function closeModal(){modal.style.display="none"}
async function publish(){let note=prompt("Release note (optional):","Content update");if(note===null)return;let r=await api("/v1/admin/publish",{method:"POST",body:JSON.stringify({note})});alert("Published "+r.version+" — "+r.item_count+" items");loadSummary();loadItems()}
async function loadReleases(){let rs=await api("/v1/admin/releases");content.innerHTML='<table><tr><th>Version</th><th>Items</th><th>Published</th><th>Note</th><th></th></tr>'+rs.map(r=>'<tr><td><b>'+r.version+'</b> '+(r.active?'<span class=badge>LIVE</span>':'')+'</td><td>'+r.item_count+'</td><td>'+new Date(r.published_at).toLocaleString()+'</td><td>'+esc(r.note||"")+'</td><td>'+(r.active?"":'<button class=secondary onclick="activate(\''+r.id+'\')">Activate / rollback</button>')+'</td></tr>').join("")+'</table>'}
async function activate(id){if(confirm("Make this version live?")){await api("/v1/admin/releases/"+id+"/activate",{method:"POST"});loadSummary();loadReleases()}}makeNav();

function applyRoleUi(){document.querySelectorAll(".editorOnly").forEach(x=>x.style.display=me&&["editor","admin"].includes(me.role)?"":"none");document.querySelectorAll(".adminOnly").forEach(x=>x.style.display=me&&me.role==="admin"?"":"none");document.querySelectorAll('nav button[data-k="admin_users"]').forEach(x=>x.style.display=me&&me.role==="admin"?"":"none")}
async function loadAdminUsers(){if(!me||me.role!=="admin"){content.innerHTML="<p>Admin role required.</p>";return}let rows=await api("/v1/admin/auth/users");content.innerHTML='<div class="toolbar"><button class="primary" onclick="createAdminUser()">+ Add administrator</button></div><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr>'+rows.map(r=>'<tr><td>'+esc(r.email)+'</td><td>'+esc(r.display_name)+'</td><td>'+r.role+'</td><td>'+(r.active?"Active":"Disabled")+'</td><td>'+(r.last_login_at?new Date(r.last_login_at).toLocaleString():"—")+'</td><td><button class="secondary" onclick="editAdminUser(\''+r.id+'\',\''+r.role+'\','+(r.active?"true":"false")+')">Edit</button></td></tr>').join("")+'</table>'}
async function createAdminUser(){let email=prompt("Admin email");if(!email)return;let name=prompt("Display name",email.split("@")[0]);if(!name)return;let role=prompt("Role: viewer, editor, admin","editor");if(!role)return;let password=prompt("Temporary password (min 12 chars)");if(!password)return;await api("/v1/admin/auth/users",{method:"POST",body:JSON.stringify({email,password,display_name:name,role})});loadAdminUsers()}
async function editAdminUser(id,role,active){let newRole=prompt("Role: viewer, editor, admin",role);if(!newRole)return;let activeText=prompt("Active? yes/no",active?"yes":"no");if(activeText===null)return;let body={role:newRole,active:activeText.toLowerCase()==="yes"};let pw=prompt("New password (leave blank to keep current)","");if(pw)body.password=pw;await api("/v1/admin/auth/users/"+id,{method:"PATCH",body:JSON.stringify(body)});loadAdminUsers()}
checkAuth();
</script></body></html>
