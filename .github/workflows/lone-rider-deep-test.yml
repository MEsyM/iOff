name: Lone Rider Deep Test

on:
  pull_request:
    paths:
      - 'daw-drive-v0.1/**'
      - 'services/api/**'
      - '.maestro/**'
      - '.github/workflows/lone-rider-deep-test.yml'
  push:
    branches:
      - codex/lone-rider-mcp-deep-test-system
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lone-rider-deep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-deep:
    name: Backend deep API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lonerider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lonerider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lonerider_test
      JWT_SECRET: ci-test-jwt
      MAGIC_LINK_PEPPER: ci-test-pepper
      MAGIC_LINK_BASE_URL: lonerider://auth
      AUTH_EMAIL_MODE: console
      TEST_ADMIN_ENABLED: 'true'
      TEST_ADMIN_LOGIN: ci-admin
      TEST_ADMIN_PASSWORD: ci-${{ github.run_id }}-admin-pass
      ADMIN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest httpx
      - name: Compile backend
        working-directory: services/api
        run: python -m compileall -q app
      - name: Run deep API tests
        working-directory: services/api
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../../artifacts
          python -m pytest -q tests/test_deep_api.py --junitxml=../../artifacts/backend-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-deep-report
          path: artifacts/backend-junit.xml
          if-no-files-found: warn

  android-build:
    name: Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle -p daw-drive-v0.1 assembleDebug --stacktrace --no-daemon
      - name: Lint
        run: gradle -p daw-drive-v0.1 lintDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lone-rider-deep-test-apk
          path: daw-drive-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-e2e:
    name: Android emulator E2E and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK for emulator
        run: gradle -p daw-drive-v0.1 assembleDebug --stacktrace --no-daemon
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts/screenshots
            adb install -r daw-drive-v0.1/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/guest-core.yaml --format junit --output artifacts/maestro-guest.xml
            maestro test .maestro/settings-account.yaml --format junit --output artifacts/maestro-settings.xml
      - name: Capture failure evidence
        if: failure()
        run: |
          mkdir -p artifacts/screenshots
          timeout 20s adb exec-out screencap -p > artifacts/screenshots/99-failure.png || true
          timeout 20s adb shell uiautomator dump /sdcard/window.xml || true
          timeout 20s adb pull /sdcard/window.xml artifacts/window.xml || true
          timeout 20s adb logcat -d > artifacts/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lone-rider-e2e-evidence
          path: |
            artifacts/screenshots/**
            artifacts/*.xml
            artifacts/logcat.txt
          if-no-files-found: warn
