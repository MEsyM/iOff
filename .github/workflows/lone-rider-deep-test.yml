name: Lone Rider Deep Test

on:
  pull_request:
    paths:
      - 'daw-drive-v0.1/**'
      - 'services/api/**'
      - '.maestro/**'
      - '.github/workflows/lone-rider-deep-test.yml'
  push:
    branches:
      - 'codex/lone-rider-*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: lone-rider-deep-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-deep:
    name: Backend deep API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lonerider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lonerider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lonerider_test
      JWT_SECRET: ci-test-jwt
      MAGIC_LINK_PEPPER: ci-test-pepper
      MAGIC_LINK_BASE_URL: lonerider://auth
      AUTH_EMAIL_MODE: console
      TEST_ADMIN_ENABLED: 'true'
      TEST_ADMIN_LOGIN: ci-admin
      TEST_ADMIN_PASSWORD: ci-${{ github.run_id }}-admin-pass
      ADMIN_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install pytest httpx
      - name: Compile backend
        working-directory: services/api
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          python -m compileall -q app 2>&1 | tee ../../artifacts/backend-compile.log
      - name: Run deep API tests
        working-directory: services/api
        env:
          PYTHONPATH: .
        run: |
          mkdir -p ../../artifacts
          set -o pipefail
          python -m pytest -q tests/test_deep_api.py --junitxml=../../artifacts/backend-junit.xml 2>&1 | tee ../../artifacts/backend-pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-deep-report
          path: artifacts/
          if-no-files-found: warn

  android-build:
    name: Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: |
          mkdir -p artifacts
          set -o pipefail
          gradle -p daw-drive-v0.1 assembleDebug --stacktrace --no-daemon 2>&1 | tee artifacts/android-build.log
      - name: Lint
        run: |
          mkdir -p artifacts
          set -o pipefail
          gradle -p daw-drive-v0.1 lintDebug --stacktrace --no-daemon 2>&1 | tee artifacts/android-lint.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lone-rider-android-build
          path: |
            artifacts/
            daw-drive-v0.1/app/build/outputs/apk/debug/app-debug.apk
            daw-drive-v0.1/app/build/reports/lint-results-debug.html
            daw-drive-v0.1/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  android-e2e:
    name: Android emulator E2E and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK for emulator
        run: gradle -p daw-drive-v0.1 assembleDebug --stacktrace --no-daemon
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash .github/scripts/run-lone-rider-e2e.sh
      - name: Capture failure evidence
        if: failure()
        run: |
          mkdir -p artifacts/screenshots
          timeout 20s adb exec-out screencap -p > artifacts/screenshots/99-failure.png || true
          timeout 20s adb shell uiautomator dump /sdcard/window.xml || true
          timeout 20s adb pull /sdcard/window.xml artifacts/window.xml || true
          timeout 20s adb logcat -d > artifacts/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lone-rider-e2e-evidence
          path: artifacts/
          if-no-files-found: error


  self-heal:
    name: Autonomous repair
    needs:
      - backend-deep
      - android-build
      - android-e2e
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'codex/lone-rider-') &&
      github.ref_name != 'codex/lone-rider-v1.18-user-admin' &&
      (
        needs.backend-deep.result != 'success' ||
        needs.android-build.result != 'success' ||
        needs.android-e2e.result != 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      BASE_BRANCH: codex/lone-rider-v1.18-user-admin
      MAX_SELF_HEAL_ATTEMPTS: "10"

    steps:
      - name: Check out failing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify OpenAI key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY."
            exit 1
          fi

      - name: Enforce repair attempt limit
        id: attempts
        run: |
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          BASE_SHA="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          COUNT="$(git log --format=%s "$BASE_SHA..HEAD" | grep -c '^self-heal:' || true)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          test "$COUNT" -lt "$MAX_SELF_HEAL_ATTEMPTS"

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          path: .self-heal/evidence

      - name: Run autonomous Codex repair
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          prompt: |
            Repair the current Lone Rider branch after a failed deep-test run.
            Diagnose the failure from .self-heal/evidence and the current source tree.
            The required result is that all existing checks pass: backend deep API,
            Android build/lint, Android emulator E2E, all Maestro journeys, and
            required screenshot evidence.

            Make the smallest safe production-quality fix.
            Do not disable, skip, delete, or weaken tests.
            Do not modify credentials, secrets, repository permissions, billing,
            or deployment settings.
            Preserve intended product behavior.
            Use screenshots, UI dumps, JUnit and logcat evidence instead of guessing.
            Run practical focused checks before finishing.
            Do not commit or push. Leave the working tree with the repair.
            If there is not enough evidence for a safe fix, make no speculative change.

      - name: Validate repair
        run: |
          rm -rf .self-heal
          if git diff --quiet; then
            echo "::error::Repair agent produced no code change."
            exit 1
          fi
          git diff --check

      - name: Commit and push repair
        env:
          ATTEMPT: ${{ steps.attempts.outputs.count }}
        run: |
          NEXT=$((ATTEMPT + 1))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "self-heal: Lone Rider CI repair attempt $NEXT"
          git push origin "HEAD:$TARGET_BRANCH"

  finish:
    name: Auto-merge when green
    needs:
      - backend-deep
      - android-build
      - android-e2e
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'codex/lone-rider-') &&
      github.ref_name != 'codex/lone-rider-v1.18-user-admin' &&
      needs.backend-deep.result == 'success' &&
      needs.android-build.result == 'success' &&
      needs.android-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      BASE_BRANCH: codex/lone-rider-v1.18-user-admin

    steps:
      - name: Merge matching PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --auto --delete-branch=false
