name: DAW Drive APK

on:
  push:
    branches:
      - codex/daw-drive-v0.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p daw-drive-v0.1 assembleDebug --stacktrace

      - name: Rename APK
        run: cp daw-drive-v0.1/app/build/outputs/apk/debug/app-debug.apk DAW-Drive-v0.12.apk

      - name: Verify APK
        run: |
          ls -lh DAW-Drive-v0.12.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose DAW-Drive-v0.12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAW-Drive-v0.12-apk
          path: DAW-Drive-v0.12.apk
          if-no-files-found: error
