name: Lone Rider APK

concurrency:
  group: lone-rider-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - codex/lone-rider-v1.8-feedback-build
      - codex/lone-rider-v1.10-live-content
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent test signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DAW_TEST_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/lone-rider-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lone-rider-signing/lone-rider-test.jks"
          chmod 600 "$RUNNER_TEMP/lone-rider-signing/lone-rider-test.jks"

      - name: Configure version and signing
        env:
          STORE_PASSWORD: ${{ secrets.DAW_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAW_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAW_TEST_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "DAW_TEST_KEYSTORE_PATH=$RUNNER_TEMP/lone-rider-signing/lone-rider-test.jks" >> "$GITHUB_ENV"
          echo "DAW_TEST_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DAW_TEST_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DAW_TEST_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "LONE_RIDER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "LONE_RIDER_VERSION_NAME=1.10-live-content.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build updateable test APK
        run: gradle -p daw-drive-v0.1 assembleDebug --stacktrace

      - name: Rename APK
        run: cp daw-drive-v0.1/app/build/outputs/apk/debug/app-debug.apk "Lone-Rider-${LONE_RIDER_VERSION_NAME}.apk"

      - name: Verify APK identity and signature
        run: |
          APK="Lone-Rider-${LONE_RIDER_VERSION_NAME}.apk"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.dualactionwindows.dawdrive'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lone-Rider-v1.10-${{ github.run_number }}
          path: Lone-Rider-*.apk
          if-no-files-found: error
