name: Android v0.5 Release Gate

on:
  push:
    branches: [main, ioff-v031]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ioff-v05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  release-gate:
    name: test-build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Record source SHA
        run: |
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}

      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}

      - name: G0 source sanity
        run: |
          ! grep -RInE 'PLACEHOLDER|TODO[[:space:]]*:[[:space:]]*CRITICAL|NotImplementedError\(' app/src/main

      - name: G1 unit tests
        run: timeout 15m gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: G2 Kotlin compile
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: G3 build internal testing APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and verify APK
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -s "$DEBUG_APK"
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          unzip -t "$DEBUG_APK" >/dev/null
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          "$AAPT" dump badging "$DEBUG_APK" > debug-badging.txt
          grep -q "package: name='cz.ioff.app'" debug-badging.txt
          grep -q "launchable-activity: name='cz.ioff.app.MainActivity'" debug-badging.txt
          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          echo "DEBUG_APK_SHA256=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: G4 screenshot regression
        run: |
          set -euo pipefail
          gradle :app:recordRoborazziDebug --stacktrace --no-daemon
          for f in 01_today.png 02_focus_setup.png 03_active_focus.png 04_focus_complete.png 05_progress.png 06_idea_parking.png 07_daily_shutdown.png 08_more.png 09_shield.png; do
            test -s "app/src/test/screenshots/$f"
          done
          mkdir -p release-gate/screenshots
          cp app/src/test/screenshots/*.png release-gate/screenshots/

      - name: G5 UI instrumentation + G6 APK smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb wait-for-device
            timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
            adb install -r "$DEBUG_APK"
            adb shell am force-stop cz.ioff.app
            adb shell monkey -p cz.ioff.app -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell pidof cz.ioff.app >/dev/null
            adb logcat -d > smoke-logcat.txt
            ! grep -E 'FATAL EXCEPTION: main|Process: cz\.ioff\.app.*has died' smoke-logcat.txt
            adb shell am force-stop cz.ioff.app
            adb shell monkey -p cz.ioff.app -c android.intent.category.LAUNCHER 1
            sleep 2
            adb shell pidof cz.ioff.app >/dev/null

      - name: Release manifest
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep "package: name='cz.ioff.app'" debug-badging.txt | head -1)"
          VERSION_CODE="$(printf '%s' "$VERSION_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s' "$VERSION_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          mkdir -p release-gate
          cat > release-gate/release-manifest.txt <<EOF
          iOff ${VERSION_NAME} internal testing candidate
          GIT_SHA=${GIT_SHA}
          CI_RUN=${GITHUB_RUN_ID}
          VERSION_CODE=${VERSION_CODE}
          VERSION_NAME=${VERSION_NAME}
          PACKAGE=cz.ioff.app
          DEBUG_APK_SHA256=${DEBUG_APK_SHA256}
          UNIT_TESTS=PASS
          KOTLIN_COMPILE=PASS
          DEBUG_BUILD=PASS
          INTERNAL_DEBUG_BUILD=PASS
          APK_VERIFY=PASS
          UI_TESTS=PASS
          SCREENSHOT_REGRESSION=PASS
          AUTOMATED_SMOKE=PASS
          PHYSICAL_DEVICE_SMOKE=PENDING
          RC_STATUS=READY_FOR_XIAOMI_DEVICE_VERIFICATION
          EOF

      - name: Upload RC bundle
        uses: actions/upload-artifact@v4
        with:
          name: iOff-v0.5-internal-${{ github.sha }}
          path: |
            ${{ env.DEBUG_APK }}
            release-gate/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOff-v0.5-failure-${{ github.sha }}
          path: |
            smoke-logcat.txt
            app/build/reports/**
            app/build/test-results/**
            app/src/test/screenshots/**
          if-no-files-found: warn
          retention-days: 14
