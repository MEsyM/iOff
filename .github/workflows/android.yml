name: Android v0.5 Release Gate

on:
  push:
    branches: [main, ioff-v031]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ioff-v05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  release-gate:
    name: test-build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source SHA
        run: |
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "emulator" "system-images;android-${ANDROID_API};google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: G0 source sanity
        run: |
          ! grep -RInE 'PLACEHOLDER|TODO[[:space:]]*:[[:space:]]*CRITICAL|NotImplementedError\(' app/src/main || {
            echo "Critical placeholder found in production source"
            exit 1
          }

      - name: G1 unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 30

      - name: G2 Kotlin compile
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: G3 build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Locate APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: G4 APK structural verify
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$DEBUG_APK" >/dev/null
          unzip -t "$RELEASE_APK" >/dev/null

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$DEBUG_APK" > debug-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" > release-badging.txt
          grep -q "package: name='cz.ioff.app'" debug-badging.txt
          grep -q "package: name='cz.ioff.app'" release-badging.txt
          grep -q "launchable-activity: name='cz.ioff.app.MainActivity'" debug-badging.txt
          grep -q "launchable-activity: name='cz.ioff.app.MainActivity'" release-badging.txt

          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

          sha256sum "$DEBUG_APK" | tee debug-apk.sha256
          sha256sum "$RELEASE_APK" | tee release-apk.sha256
          echo "DEBUG_APK_SHA256=$(cut -d' ' -f1 debug-apk.sha256)" >> "$GITHUB_ENV"
          echo "RELEASE_APK_SHA256=$(cut -d' ' -f1 release-apk.sha256)" >> "$GITHUB_ENV"

      - name: Create emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd -n ioff-ci -k "system-images;android-${ANDROID_API};google_apis;x86_64" --force

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd ioff-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: G5 UI instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          if gradle :app:tasks --all --no-daemon | grep -q '^connectedDebugAndroidTest'; then
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
          else
            echo "connectedDebugAndroidTest task is unavailable"
            exit 1
          fi

      - name: G5 screenshot regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-gate/screenshots

          if gradle :app:tasks --all --no-daemon | grep -q '^verifyPaparazziDebug'; then
            gradle :app:verifyPaparazziDebug --stacktrace --no-daemon
            find app/build -type f \( -name '*.png' -o -name '*.webp' \) -path '*paparazzi*' -exec cp --parents {} release-gate/screenshots/ \; || true
          elif gradle :app:tasks --all --no-daemon | grep -q '^verifyRoborazziDebug'; then
            gradle :app:verifyRoborazziDebug --stacktrace --no-daemon
            find app/build -type f \( -name '*.png' -o -name '*.webp' \) -path '*roborazzi*' -exec cp --parents {} release-gate/screenshots/ \; || true
          elif [ -d app/src/screenshotTest ]; then
            echo "screenshotTest source set exists but no supported verify task is configured"
            exit 1
          else
            echo "No screenshot regression suite configured. RC must stay red until it exists."
            exit 1
          fi

      - name: G6 automated APK smoke
        shell: bash
        run: |
          set -euo pipefail
          adb install -r "$DEBUG_APK"
          adb shell am force-stop cz.ioff.app
          adb shell monkey -p cz.ioff.app -c android.intent.category.LAUNCHER 1
          sleep 3
          adb shell pidof cz.ioff.app > app.pid
          test -s app.pid
          adb shell dumpsys activity activities | grep -q 'cz.ioff.app'
          adb logcat -d > smoke-logcat.txt
          ! grep -E 'FATAL EXCEPTION: main|Process: cz\.ioff\.app.*has died' smoke-logcat.txt
          adb shell am force-stop cz.ioff.app
          adb shell monkey -p cz.ioff.app -c android.intent.category.LAUNCHER 1
          sleep 2
          adb shell pidof cz.ioff.app >/dev/null

      - name: Extract version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep "package: name='cz.ioff.app'" debug-badging.txt | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$VERSION_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$VERSION_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: G7 create release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-gate
          cat > release-gate/release-manifest.txt <<EOF
          iOff ${VERSION_NAME} automated release candidate

          GIT_SHA=${GIT_SHA}
          GITHUB_SHA=${GITHUB_SHA}
          CI_RUN=${GITHUB_RUN_ID}
          CI_RUN_NUMBER=${GITHUB_RUN_NUMBER}
          VERSION_CODE=${VERSION_CODE}
          VERSION_NAME=${VERSION_NAME}
          PACKAGE=cz.ioff.app
          DEBUG_APK_SHA256=${DEBUG_APK_SHA256}
          RELEASE_APK_SHA256=${RELEASE_APK_SHA256}

          SOURCE_SANITY=PASS
          UNIT_TESTS=PASS
          KOTLIN_COMPILE=PASS
          DEBUG_BUILD=PASS
          RELEASE_BUILD=PASS
          APK_VERIFY=PASS
          UI_TESTS=PASS
          SCREENSHOT_REGRESSION=PASS
          AUTOMATED_SMOKE=PASS
          PHYSICAL_DEVICE_SMOKE=PENDING
          RC_STATUS=PENDING_DEVICE_VERIFICATION
          EOF
          cat release-gate/release-manifest.txt

      - name: Collect reports and screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p release-gate/reports
          cp debug-badging.txt release-badging.txt debug-apk.sha256 release-apk.sha256 release-gate/reports/ 2>/dev/null || true
          cp emulator.log smoke-logcat.txt release-gate/reports/ 2>/dev/null || true
          cp -R app/build/reports/androidTests release-gate/reports/ 2>/dev/null || true

      - name: Upload release candidate bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOff-v0.5-rc-${{ github.sha }}
          path: |
            ${{ env.DEBUG_APK }}
            ${{ env.RELEASE_APK }}
            release-gate/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOff-v0.5-failure-${{ github.sha }}
          path: |
            emulator.log
            smoke-logcat.txt
            app/build/reports/**
            app/build/test-results/**
            release-gate/**
          if-no-files-found: warn
          retention-days: 14
