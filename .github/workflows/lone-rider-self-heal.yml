name: Lone Rider Self Heal

on:
  workflow_run:
    workflows:
      - "Lone Rider Deep Test"
    types:
      - completed

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: lone-rider-self-heal-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/lone-rider-mcp-deep-test-system
  BASE_BRANCH: codex/lone-rider-v1.18-user-admin
  MAX_SELF_HEAL_ATTEMPTS: "10"

jobs:
  repair:
    name: Diagnose, fix, push, repeat
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'codex/lone-rider-mcp-deep-test-system'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out failing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify OpenAI key is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY. Add it once in GitHub Actions secrets to enable automatic self-healing."
            exit 1
          fi

      - name: Count self-heal attempts
        id: attempts
        run: |
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          BASE_SHA="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          COUNT="$(git log --format=%s "$BASE_SHA..HEAD" | grep -c '^self-heal:' || true)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Self-heal attempts so far: $COUNT / $MAX_SELF_HEAL_ATTEMPTS"
          if [ "$COUNT" -ge "$MAX_SELF_HEAL_ATTEMPTS" ]; then
            echo "::error::Self-heal attempt limit reached."
            exit 1
          fi

      - name: Collect failing run logs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .self-heal/evidence
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > .self-heal/evidence/failed.log || true
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs,conclusion,url,headSha,headBranch > .self-heal/evidence/run.json
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir .self-heal/evidence/artifacts || true
          find .self-heal/evidence -maxdepth 4 -type f -print | sort > .self-heal/evidence/files.txt

      - name: Run Codex repair agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          prompt: |
            You are the autonomous repair agent for Lone Rider in repository ${{ github.repository }}.

            The latest "Lone Rider Deep Test" run failed. Diagnose it from:
            - .self-heal/evidence/failed.log
            - .self-heal/evidence/run.json
            - .self-heal/evidence/artifacts/
            - the current source tree

            Goal: make the current branch pass ALL existing Lone Rider deep tests:
            backend deep API, Android build/lint, Android emulator E2E, both Maestro journeys,
            and required screenshot evidence.

            Rules:
            - Make the smallest safe production-quality fix.
            - Do not disable, skip, weaken, or delete tests to manufacture green.
            - Do not change secrets, credentials, repository permissions, or deployment settings.
            - Preserve existing user behavior unless the failure proves behavior is wrong.
            - Use captured screenshots/UI hierarchy/logcat when available.
            - Run focused local checks that are practical on this runner.
            - Do not commit or push; leave the working tree with the fix.
            - If no safe fix is possible from available evidence, do not invent one; explain the blocker in your final message.

      - name: Reject no-op repair
        run: |
          if git diff --quiet; then
            echo "::error::Codex produced no repository change."
            exit 1
          fi
          git diff --check

      - name: Commit and push repair
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.attempts.outputs.count }}
        run: |
          NEXT=$((ATTEMPT + 1))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "self-heal: Lone Rider CI repair attempt $NEXT"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$TARGET_BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Report repair iteration
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Self-heal pushed a repair after failing run: $RUN_URL. A new deep-test run starts automatically."
          fi

  finish:
    name: Merge when fully green
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'codex/lone-rider-mcp-deep-test-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Merge matching PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "No open PR found for $TARGET_BRANCH -> $BASE_BRANCH; nothing to merge."
            exit 0
          fi

          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable,isDraft,url,headRefOid,baseRefName
          DRAFT="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          MERGEABLE="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')"

          if [ "$DRAFT" = "true" ]; then
            echo "::error::PR #$PR is draft; not auto-merging."
            exit 1
          fi
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::PR #$PR has merge conflicts."
            exit 1
          fi

          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch=false
